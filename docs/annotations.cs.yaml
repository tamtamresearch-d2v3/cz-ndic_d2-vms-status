# Ruční texty k tabulkám elementů – JEDINÝ ručně psaný vstup tabulek.
# Třída:
#   _: úvodní věta tabulky
#   element:
#     ndic: pravidlo NDIC – zobrazí se za definicí (note: by definici nahradil)
#     card: '1..1'   # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true # NDIC vždy vyplňuje
#     values: {literal: překlad}
# _enum: {Enum.literal: překlad} – přepisuje sdílený slovník kitu
# Převzato z dokumentace cz-ndic_d2-vms-v1.1 (tabulky elementů), upraveno pro DATEX II 3.7.

VmsPublication:
  feedType:
    ndic: Odkaz na zdroj dat v registru národního přístupového bodu (https://registr.dopravniinfo.cz/),
      např. `x-source:cz-ndic_d2-vms-status-fixed-pull-v3`. Formát určují atributy `@profileName` a `@profileVersion`.
  publicationTime:
    ndic: Čas vygenerování publikace; mění se s každým vygenerováním, i beze změny obsahu.
  publicationCreator:
    ndic: 'Poskytovatel publikace: `country` = `cz`, `nationalIdentifier` = zkratka poskytovatele (NDIC).'
  headerInformation:
    ndic: Vždy `confidentiality` = `noRestriction` a `informationStatus` = `real`.
  vmsControllerStatus:
    ndic: Stav celého řadiče; obsahuje vždy stav všech VMS daného řadiče.
VmsControllerStatus:
  vmsControllerTableReference:
    ndic: Identifikátor a verze tabulky ve statické publikaci (verze se mění jen ve výjimečných případech).
  vmsControllerReference:
    ndic: Identifikátor a verze řadiče ve statické publikaci (verze se mění při změně konfigurace či polohy).
  statusUpdateTime:
    ndic: Čas aktualizace řadiče = nejvyšší `timeLastSet` jeho VMS. Neuvádí se jen při deaktivaci řadiče,
      kdy je čas v `vmsControllerFault`.
  vmsStatus:
    ndic: Vynechává se jen při deaktivaci řadiče.
  vmsControllerFault:
    card: 0..1
    ndic: Jen pro deaktivaci verze řadiče (přesun, zneplatnění). Verze se znovu aktivuje zveřejněním jejího
      stavu bez `vmsControllerFault`. Platná je vždy jen jedna verze řadiče.
VmsControllerFault:
  faultLastUpdateTime:
    ndic: Čas deaktivace.
  vmsControllerFault:
    ndic: 'Vždy `_extended`; důvod deaktivace v `@_extendedValue`: `vmsControllerDeactivated` (důvod neuveden),
      `vmsControllerMovedToAnotherLocation` (přesun), `vmsControllerLayoutChanged` (předělávka činných ploch či
      jízdních pruhů), `vmsControllerMovedAndLayoutChanged` (přesun i předělávka).'
VmsStatus:
  workingStatus:
    ndic: Povoleny všechny hodnoty.
  vmsDynamicConfiguration:
    ndic: Jen při dočasné změně rozložení aktivních činných ploch bez změny statické publikace. Po dobu
      změny musí být přítomna a nahrazuje celý popis konfigurace ve statické publikaci; struktura je shodná
      s `vmsConfiguration`.
  vmsMessage:
    card: 0..1
    ndic: Cyklování zpráv se nepoužívá – nejvýše jedna `vmsMessage` s indexem 1. Nezobrazuje-li VMS nic nebo
      je mimo provoz (`workingStatus` = `blank`, `notWorking`), zpráva se neuvádí.
  vmsLocationOverride:
    ndic: Při změně polohy značky (vozíku) bez změny statické publikace, typ `loc:PointLocation`. Po dobu
      změny musí být přítomna a nahrazuje celý popis polohy ve statické publikaci; struktura je shodná
      s `vmsLocation`.
VmsMessage:
  messageInformationType:
    card: 0..1
    ndic: U VMS bez zobrazení se neuvádí.
  displayAreaSettings:
    card: 1..n
    ndic: Informace zobrazené na činné ploše, typ `vms:PictogramDisplay` nebo `vms:TextDisplay`.
PictogramDisplay:
  isBlank:
    ndic: '`true`, nezobrazuje-li plocha nic (zpravidla spolu s `workingStatus` = `blank`, GDD kódem 11.991
      a `pictogramDescription` = `blankVoid`), jinak `false`.'
  legallyBinding:
    ndic: '`true` pro zákazovou či příkazovou značku, jinak `false`. Při `isBlank` = `true` se vynechává.'
  pictogramDisplayUrl:
    ndic: URL obrázku činné plochy
      (`https://mobilitydata.rsd.cz/VMS/<identifikátor řadiče>/<index VMS>/<index plochy>`).
  pictogram:
    ndic: Zobrazený piktogram, typ `vms:RegularPictogram` nebo `vms:CompositePictogram`.
  supplementaryInformationDisplay:
    ndic: Dodatková tabulka, typ `vms:SupplementaryPictogram` nebo `vms:SupplementaryText`. Popisuje význam
      a kód dodatkové tabulky; číselné hodnoty jsou v nadřazeném piktogramu.
RegularPictogram:
  customPictogramCode:
    ndic: Povinný kód piktogramu v tabulce piktogramů (`pictogramCodeListIdentifier` ve statické
      publikaci), např. `A23`.
  pictogramInInverseColour:
    ndic: '`true` = inverzní barvy (nespojitá značka), platí pro všechny maticové VMS; `false` jen
      u hranolových či plechových značek. Při `isBlank` = `true` se vynechává.'
  gddStructure:
    ndic: Kód piktogramu podle ISO 14823:2017; jen existuje-li v normě popis.
  displayedNumericalInformation:
    ndic: Číselná hodnota a její význam, zobrazená na piktogramu či na dodatkové tabulce.
  pictogramDescription:
    card: 0..1
    ndic: Popis piktogramu, jen jako doplněk toho, co nepopisuje GDD; lze uvést i spolu s kódem GDD.
  presenceOfRedTriangle:
    ndic: '`true` u výstražných značek, `false` pro zobrazení vnitřní části výstražné značky na VMS;
      uvádí se jen při `pictogramInformationType` = `warning`.'
CompositePictogram:
  regularPictogram:
    ndic: Standardní piktogram použitý ve složeném zobrazení (struktura `vms:RegularPictogram`).
GddStructure:
  gddPictogramIdentification:
    ndic: Trojčíselný kód piktogramu podle ISO 14823 (nástupce ISO 14823-1:2024 má nové piktogramy a změny kódů).
DisplayedNumericalInformation:
  numericalInformationType:
    ndic: Význam číselné hodnoty zobrazené na piktogramu či dodatkové tabulce.
SupplementaryPictogram:
  pictogramCode:
    ndic: Povinný kód dodatkové tabulky (piktogramu) v tabulce piktogramů.
SupplementaryText:
  textLine:
    ndic: Řádek textové dodatkové tabulky; u VMS se zpravidla nepoužívá.
TextDisplay:
  textLine:
    ndic: Řádky činné plochy typu text shora dolů, horní řádek má `@lineIndex` = 1.
TextLine:
  textLine:
    ndic: Text řádku v UTF-8.
  lineLanguage:
    card: '1'
    ndic: Uvádí se vždy (schéma atribut nevyžaduje).
  lineColour:
    ndic: Výchozí bílá.
  lineHtml:
    ndic: Popis řádku v HTML, obsahuje-li speciální symboly (např. šipky).
  textInformationType:
    ndic: Typ textové informace na řádku, lze-li jej jednoznačně určit, jinak se vynechá.

_enum: {}
NetworkLocation:
  supplementaryPositionalDescription:
    ndic: Doplňkový popis aktuální polohy VMS na úrovni jízdního pruhu včetně názvu a směru komunikace.
SupplementaryPositionalDescription:
  positionOnCarriageway:
    card: 1..1
    ndic: 'Umístění VMS na konstrukci: `onTheLeft` (na sloupu vlevo po směru jízdy), `inTheCentre` (na příčníku
      nad vozovkou, i poloportál), `onTheRight` (na sloupu vpravo po směru jízdy).'
  carriageway:
    card: 1..1
    ndic: Jízdní pás a pruh, pro který VMS platí.
  roadInformation:
    card: 1..1
    ndic: Směr (`roadDestination`), název (`roadName`) a číslo (`roadNumber`) komunikace, na které VMS leží.
Carriageway:
  carriageway:
    ndic: Vždy `mainCarriageway`.
  originalNumberOfLanes:
    ndic: Uvádí se, je-li znám.
  lane:
    card: 1..1
    ndic: '`laneNumber` (1 = první pruh zprava, 0 = zpevněná krajnice), řídí-li VMS jízdní pruh, nebo
      `laneUsage` = `allLanesCompleteCarriageway`, platí-li pro celý jízdní pás.'
